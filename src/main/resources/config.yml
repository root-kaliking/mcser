#插件常规消息选项。
messages-general:
  #管理员命令和消息的显示方式。
  admin:
    #启用或禁用管理员消息前缀。
    prefix_enabled: false
    prefix: "&7[&6Versus&7] "
    #设置管理员消息的主色调。
    primary_color: "&6"
    #设置用于融入背景的文字颜色，如确认消息。
    subtle_color: "&7"
    #设置用于突出关键文字（如玩家名）的颜色。
    highlighted_color: "&c"
    #设置重要文字（如按钮或标题）的颜色。
    bold_color: "&6&l"
    #设置所有聊天消息中线条元素的样式。
    line: "&6&m-------------------------------------"
  #错误消息的样式显示方式。
  errors:
    #设置聊天中错误消息前显示的文字和颜色。
    error_prefix: "&c错误: &4"
    no_permission_message: "你没有权限使用该命令。"
    only_players_message: "只有玩家才能使用此命令！"


#  ____   _____  _____  __     _  _____  _____
