#决斗请求的聊天消息和样式选项。
requesting:
  mechanics:
    #设置玩家是否可以通过shift点击其他玩家角色来发起决斗请求。
    shift_click_requesting_enabled: false
  messages:
    #玩家拒绝决斗请求后收到的聊天消息。
    denied_request_confirmation: "&7你拒绝了 &c%player%&6 的决斗请求&7。"
    #玩家拒绝他人决斗请求后, 对方收到的聊天消息。
    denied_request: "&c%player% &7拒绝了你的 &6决斗请求&7。"
    #玩家发送决斗请求后收到的聊天消息。
    sent_request: "&7你向 &6%player% &7发送了 &c决斗请求&7。"
    #玩家收到决斗请求时的聊天消息。
    request_notification: "&6%player% &7邀请你进行 &c决斗!"
    #玩家点击接受决斗请求的文本样式。
    accept_button: "&7&l[&a&l接受&7&l]"
    #玩家点击拒绝决斗请求的文本样式。
    deny_button: "&7&l[&c&l拒绝&7&l]"
    #没有可用竞技场时发送给玩家的聊天消息。
    no_arenas_available: "&6你已被加入队列。请等待有可用的竞技场。"
    #取消决斗队列后发送给玩家的聊天消息。
    cancel_request: "&6你已退出决斗队列。"



