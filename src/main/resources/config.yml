#决斗行为、消息和时间设置。
dueling:
  mechanics:
    #设置是否需要 'versus.spectate' 和 'versus.duel' 权限才能观战和决斗。
    #如果为 false, 任何玩家都可以决斗。
    permission_required_to_duel: false

    #设置胜者决斗后返回的位置。
    #选项包括: 'spectate' , 'spawn' , 'previous', 和 'custom'。
    #输入其他值将默认为 'spawn'。
    #'spectate' 返回观战区域。
    #'spawn' 返回出生点。
    #'previous' 返回决斗前的位置。
    #'custom' 返回自定义位置, 在下方配置。
    return_winners: 'spectate'
    #此设置仅在 'return_winners' 设为 'custom' 时生效。
    winner_return_location:
      x: 0
      y: 0
      z: 0
      world: "world"


    #设置败者决斗后返回的位置。
    #选项包括: 'spectate' , 'spawn' , 'previous', 和 'custom'。
    #输入其他值将默认为 'spawn'。
    #'spectate' 返回观战区域。
    #'spawn' 返回出生点。
    #'previous' 返回决斗前的位置。
    #'custom' 返回自定义位置, 在下方配置。
    return_losers: 'spawn'
    #此设置仅在 'return_losers' 设为 'custom' 时生效。
    loser_return_location:
      x: 0
      y: 0
      z: 0
      world: "world"



    #设置玩家在决斗失败后是否立即复活, 跳过重生界面。
    instant_respawn: false

    #决斗中是否允许放置方块。
    allow_block_placements: true
    #决斗中是否允许破坏方块。
    allow_block_destruction: true
    #设置决斗开始前的倒计时时间(秒)。
    countdown_duration: 5
    #决斗期间被禁用的命令列表。
    blocked_commands:
      - 'heal'
      - 'gamemode'
      - 'spawn'
      - 'kit'
      - 'tp'
      - 'tpa'
      - 'tpyes'
      - 'tpaccept'
      - 'tpahere'
      - 'etpa'
      - 'back'
      - 'eback'
      - 'return'
      - 'ereturn'
      - 'sethome'
      - 'esethome'
      - 'createhome'
      - 'ecreatehome'
      - 'espawn'
      - 'chest'
      - 'vault'
      - 'enderchest'

  #决斗期间的药水效果、烟花效果选项。
  announcements:
    #设置是否在全局聊天中公告决斗。
    announce_duels: false
    #公告决斗开始的文本。
    #在 %button% 和 %button% 之间放置玩家点击观战的文本。
    duel_start_announcement: "&c%player_one%&6 正在与 &c%player_two%&6 决斗! %button%&6&l点击此处观战.%button%"
    #公告决斗结束及胜者/败者的文本。
    duel_end_announcement: "&6恭喜 &c%winner%&6! 他刚刚赢得了与 &c%loser%&6 的比赛!"
  effects:
    #启用或禁用进入决斗时的失明效果。
    blindness_effects_enabled: true
    #启用或禁用决斗胜利后播放的效果。
    victory_effects_enabled: true
    #设置决斗胜利后效果的持续时间(秒)。
    victory_effects_duration: 10
    #启用或禁用决斗期间的所有烟花效果。
    fireworks_enabled: true
    #设置决斗期间烟花的颜色。请查看此配置文件顶部的颜色选项。
    fireworks_color: "blue"
  #决斗期间播放的音乐选项。
  music:
    #启用或禁用决斗期间的音乐。
    fight_music_enabled: true
    #设置决斗期间播放的音乐。请查看此配置文件顶部的音乐选项。
    fight_music: 'disc_far'
    #启用或禁用玩家赢得决斗后播放的音乐。
    victory_music_enabled: true
    victory_music: 'disc_pigstep'
  #决斗期间显示的聊天消息和标题(屏幕文字)选项。
  messages:
    #决斗倒计时期间在玩家屏幕上显示的文字。
    countdown_title: "&7%seconds%"
    #决斗倒计时期间发送给每个玩家的聊天消息。
    countdown_message: "&6&e%seconds%&6 秒后开始"
    #决斗开始时在玩家屏幕上显示的文字。
    duel_go_message: "&6&l开始!"
    #玩家赢得决斗后在屏幕上显示的文字。
    victory_title_message: "&6&l胜利"
    #玩家赢得决斗后屏幕上显示的副标题。
    victory_subtitle_message: "%player%"
    #玩家决斗失败复活后收到的聊天消息。
    duel_loss_message: "&6别灰心 &c%player%。"
    #观战者进入竞技场后收到的聊天消息。
    duel_spectate_message: "&7你正在观战 &6%player_one% &7和 &6%player_two% &7的决斗。"


