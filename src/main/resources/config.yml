#(可选)
#依赖项和与其他插件或API交互的选项。
dependencies:
  placeholderAPI:
    #注意: 此功能仅在以下条件满足时有效:
    #1) Essentials 和 PlaceholderAPI 都已安装。
    #2) Essentials 已通过输入 /papi ecloud download Essentials 注册到 PlaceholderAPI。
    #否则, 此功能将被忽略, 玩家名称将保持不变。
    #设置是否用 Essentials 昵称替换 Versus 聊天消息中的玩家名称。
    essentials_nicknames_enabled: true
  itemsadder:
    #设置是否可以将自定义 ItemsAdder 物品保存到物品包中。
    items_adder_for_kits: true
